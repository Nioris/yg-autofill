name: Сообщение об ошибке
description: Проблема с заполнением, поиском поля или обработкой JSON
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте секреты, приватные URL и персональные данные. По возможности приложите обезличенный лог.
  - type: input
    id: version
    attributes:
      label: Версия YG Autofill
      placeholder: "12.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Браузер и версия
      placeholder: "Chrome"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Шаблон адреса страницы
      description: Без чувствительных параметров
      placeholder: "/console/application/123456?new=true#application-info-draft"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Загрузить JSON...
        2. Включить флажок...
        3. Нажать...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Журнал YG Autofill
      description: Вставьте обезличенный лог
      render: text
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Минимальный обезличенный JSON
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я повторил проблему после перезагрузки страницы и повторного запуска последней версии.
          required: true
        - label: Я удалил из отчёта секреты и персональные данные.
          required: true
